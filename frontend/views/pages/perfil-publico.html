<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>if(!localStorage.getItem('auth_token')&&!sessionStorage.getItem('auth_token')){window.location.replace('/index.html');}</script>
    <title>Perfil | Labu</title>
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/profile.css">
</head>
<body>

    <nav class="navbar">
        <div class="navbar-content">
            <div style="display:flex; align-items:center; gap:1rem;">
                <button class="btn-back" onclick="history.back()">&#8592; Volver</button>
                <div class="logo" onclick="App.navigateTo('feed')">Labu</div>
            </div>
        </div>
    </nav>

    <div id="profileContent">
        <!-- ─── LOADING SKELETON ─── -->
        <div class="profile-hero">
            <div class="cover-photo"></div>
            <div class="profile-header-bar">
                <div class="profile-avatar-wrapper">
                    <div class="profile-avatar" style="background:var(--border); color:var(--border);">&#9203;</div>
                </div>
                <div class="profile-header-info" style="padding-bottom:0.5rem;">
                    <div style="font-size:1.75rem; font-weight:900; color:var(--gray);">Cargando perfil...</div>
                </div>
            </div>
        </div>
        <div class="profile-body">
            <div style="text-align:center; padding:3rem; color:var(--gray); grid-column:1/-1;">
                <style>.rt-spin{animation:rt-spin 0.8s linear infinite}@keyframes rt-spin{to{transform:rotate(360deg)}}</style>
                <div class="rt-spin" style="width:36px;height:36px;border:3px solid #e0e0e0;border-top-color:var(--primary);border-radius:50%;margin:0 auto 1rem;"></div>
                Cargando...
            </div>
        </div>
    </div>

    <script src="/js/auth.js"></script>
    <script src="/js/main.js"></script>
    <script src="/js/modules/perfil-publico.js"></script>
</body>
</html>
