<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>if(!localStorage.getItem('auth_token')&&!sessionStorage.getItem('auth_token')){window.location.replace('/index.html');}</script>
    <title>Labu - Mis Ofertas</title>
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/navigation.css">
    <link rel="stylesheet" href="/css/mis-ofertas.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="navbar-content">
            <div class="logo" onclick="App.navigateTo('feed')">Labu</div>
            <div class="nav-search">
                <span class="nav-search-icon">&#128269;</span>
                <input type="text" id="navSearchInput" placeholder="Buscar trabajos, profesionales...">
            </div>
            <div class="nav-icons">
                <div class="nav-icon" title="Notificaciones" onclick="App.navigateTo('notificaciones')">
                    &#128276;
                    <span class="badge" id="notification-badge"></span>
                </div>
                <div class="nav-icon" title="Mensajes" onclick="App.navigateTo('mensajes')">
                    &#128172;
                    <span class="badge" id="message-badge"></span>
                </div>
                <div class="nav-icon nav-avatar" title="Mi perfil" onclick="App.navigateTo('mi-perfil')" id="navAvatar">&#128100;</div>
            </div>
        </div>
    </nav>

    <div class="offers-layout">

        <div class="page-header">
            <h1>&#128176; Mis Ofertas</h1>
            <p>Todas las ofertas que enviaste en trabajos publicados</p>
        </div>

        <div class="stats-grid">
            <div class="stat-card active" data-filter="todas" onclick="filtrar('todas', this)">
                <div class="stat-number" id="stat-total">0</div>
                <div class="stat-label">Total</div>
            </div>
            <div class="stat-card" data-filter="pendiente" onclick="filtrar('pendiente', this)">
                <div class="stat-number" id="stat-pendiente">0</div>
                <div class="stat-label">Pendientes</div>
            </div>
            <div class="stat-card" data-filter="aceptada" onclick="filtrar('aceptada', this)">
                <div class="stat-number" id="stat-aceptada">0</div>
                <div class="stat-label">Aceptadas</div>
            </div>
            <div class="stat-card" data-filter="rechazada" onclick="filtrar('rechazada', this)">
                <div class="stat-number" id="stat-rechazada">0</div>
                <div class="stat-label">Rechazadas</div>
            </div>
        </div>

        <div class="card">
            <div class="filters-bar">
                <div class="filter-tabs">
                    <div class="filter-tab active" data-filter="todas" onclick="filtrar('todas', this)">Todas</div>
                    <div class="filter-tab" data-filter="pendiente" onclick="filtrar('pendiente', this)">Pendientes</div>
                    <div class="filter-tab" data-filter="aceptada" onclick="filtrar('aceptada', this)">Aceptadas</div>
                    <div class="filter-tab" data-filter="rechazada" onclick="filtrar('rechazada', this)">Rechazadas</div>
                    <div class="filter-tab" data-filter="contraoferta" onclick="filtrar('contraoferta', this)">Contraofertas</div>
                </div>
            </div>
            <div class="offers-list" id="offersList">
                <div class="empty-state">
                    <div class="empty-icon">&#9203;</div>
                    <p>Cargando ofertas...</p>
                </div>
            </div>
        </div>

        <div style="margin-top:1.5rem;text-align:center;">
            <p style="font-size:0.9rem;color:var(--gray);">
                &#128736; ¿Ya aceptaron tu oferta? Gestion&#225; tus trabajos en
                <a href="/pages/mis-trabajos.html" style="color:var(--primary);font-weight:600;">Mis Trabajos</a>
            </p>
        </div>

    </div>

    <script src="/js/auth.js"></script>
    <script src="/js/main.js"></script>
    <script src="/js/modules/mobile-nav.js"></script>
    <script src="/js/modules/navbar.js"></script>
    <script src="/js/modules/mis-ofertas.js"></script>
</body>
</html>
