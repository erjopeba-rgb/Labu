<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>if(!localStorage.getItem('auth_token')&&!sessionStorage.getItem('auth_token')){window.location.replace('/index.html');}</script>
    <title>Labu - Mis Ayudantes</title>
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/ayudantes.css">
</head>
<body>

    <nav class="navbar">
        <div class="navbar-content">
            <div style="display:flex; align-items:center; gap:1rem;">
                <button class="btn-back" onclick="window.location.href='/pages/feed.html'">&#8592; Volver</button>
                <div class="logo" onclick="App.navigateTo('feed')">Labu</div>
            </div>
        </div>
    </nav>

    <div class="ayudantes-layout">

        <div class="page-header">
            <h1>&#129309; Mis Ayudantes</h1>
            <p>Gestioná tus ayudantes, revisá aplicaciones y encontrá trabajos como ayudante</p>
        </div>

        <!-- Tabs -->
        <div class="tabs">
            <button class="tab-btn active" data-tab="mis-ayudantes" onclick="cambiarTab('mis-ayudantes')">Mis Ayudantes</button>
            <button class="tab-btn" data-tab="mis-solicitudes" onclick="cambiarTab('mis-solicitudes')">Aplicaciones Recibidas</button>
            <button class="tab-btn" data-tab="crear-solicitud" onclick="cambiarTab('crear-solicitud')">Solicitar Ayudantes</button>
            <button class="tab-btn" data-tab="buscar" onclick="cambiarTab('buscar')">Buscar Trabajos</button>
        </div>

        <!-- Tab: Mis Ayudantes -->
        <div class="tab-panel active" id="tab-mis-ayudantes">
            <div class="card-list" id="lista-mis-ayudantes">
                <p style="color:var(--gray)">Cargando...</p>
            </div>
        </div>

        <!-- Tab: Aplicaciones recibidas -->
        <div class="tab-panel" id="tab-mis-solicitudes">
            <div class="card-list" id="lista-mis-solicitudes">
                <p style="color:var(--gray)">Cargando...</p>
            </div>
        </div>

        <!-- Tab: Solicitar ayudantes -->
        <div class="tab-panel" id="tab-crear-solicitud">
            <div class="form-card">
                <h3>&#128221; Nueva solicitud de ayudantes</h3>
                <form id="form-solicitud" onsubmit="crearSolicitud(event)">
                    <div class="form-group">
                        <label for="select-trabajo">Trabajo</label>
                        <select id="select-trabajo">
                            <option value="">Cargando trabajos...</option>
                        </select>
                        <div class="form-error" id="err-trabajo">Seleccioná un trabajo.</div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="input-cantidad">Cantidad de ayudantes</label>
                            <input type="number" id="input-cantidad" min="1" max="10" placeholder="1">
                            <div class="form-error" id="err-cantidad">Ingresá la cantidad (mínimo 1).</div>
                        </div>
                        <div class="form-group">
                            <label for="input-pago">Pago por ayudante ($)</label>
                            <input type="number" id="input-pago" min="1" step="0.01" placeholder="5000">
                            <div class="form-error" id="err-pago">Ingresá el pago (mayor a 0).</div>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="input-descripcion">Descripción (opcional)</label>
                        <textarea id="input-descripcion" rows="3" placeholder="¿Qué necesitás que haga el ayudante?"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Crear Solicitud</button>
                </form>
            </div>
        </div>

        <!-- Tab: Buscar solicitudes abiertas -->
        <div class="tab-panel" id="tab-buscar">
            <div class="card-list" id="lista-solicitudes-abiertas">
                <p style="color:var(--gray)">Cargando...</p>
            </div>
        </div>

    </div>

    <div class="toast" id="toast"></div>

    <script src="/js/auth.js"></script>
    <script src="/js/main.js"></script>
    <script src="/js/modules/mobile-nav.js"></script>
    <script src="/js/modules/ayudantes.js"></script>

</body>
</html>
