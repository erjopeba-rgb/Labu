<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>if(!localStorage.getItem('auth_token')&&!sessionStorage.getItem('auth_token')){window.location.replace('/index.html');}</script>
    <title id="pageTitle">Labu - Notificaciones</title>
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/navigation.css">
    <link rel="stylesheet" href="/css/notificaciones.css">
</head>
<body>

    <!-- Navbar — componente: /components/navbar.html -->
    <nav class="navbar">
        <div class="navbar-content">
            <div class="logo" onclick="App.navigateTo('feed')">Labu</div>
            <div class="nav-search">
                <span class="nav-search-icon">&#128269;</span>
                <input type="text" id="navSearchInput" placeholder="Buscar trabajos, profesionales...">
            </div>
            <div class="nav-icons">
                <div class="nav-icon" title="Notificaciones" onclick="App.navigateTo('notificaciones')">
                    &#128276;
                    <span class="badge" id="notification-badge"></span>
                </div>
                <div class="nav-icon" title="Mensajes" onclick="App.navigateTo('mensajes')">
                    &#128172;
                    <span class="badge" id="message-badge"></span>
                </div>
                <div class="nav-icon nav-avatar" title="Mi perfil" onclick="App.navigateTo('mi-perfil')" id="navAvatar">&#128100;</div>
            </div>
        </div>
    </nav>

    <div class="notifications-layout">

        <div class="page-header">
            <div class="page-header-left">
                <button class="btn-secondary" onclick="App.navigateTo('feed')">&#8592; Volver al Feed</button>
                <h1>&#128276; Notificaciones <span id="contadorNoLeidas" class="badge-counter" style="display:none;"></span></h1>
            </div>
            <div class="header-actions">
                <button id="btnMarcarTodas" class="btn-primary" onclick="marcarTodasLeidas()">&#9989; Marcar Todo como Le&#237;do</button>
            </div>
        </div>

        <div class="card">
            <div class="filters-bar">
                <div class="filter-tab active" id="tab-todas"   onclick="filtrar('todas', this)">Todas</div>
                <div class="filter-tab"        id="tab-oferta"  onclick="filtrar('oferta', this)">Ofertas</div>
                <div class="filter-tab"        id="tab-trabajo" onclick="filtrar('trabajo', this)">Trabajos</div>
                <div class="filter-tab"        id="tab-pago"    onclick="filtrar('pago', this)">Pagos</div>
                <div class="filter-tab"        id="tab-sistema" onclick="filtrar('sistema', this)">Sistema</div>
            </div>
            <div class="notifications-list" id="notificationsList">
                <div class="empty-state">
                    <div class="empty-icon">&#9203;</div>
                    <p>Cargando notificaciones...</p>
                </div>
            </div>
        </div>

    </div>

    <script src="/js/auth.js"></script>
    <script src="/js/main.js"></script>
    <script src="/js/modules/notif-modal.js"></script>
    <script src="/js/modules/notificaciones.js"></script>
</body>
</html>
