<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Labu - Restablecer contraseña</title>
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/auth.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .reset-card {
            background: var(--white);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            padding: var(--space-2xl);
            width: 100%;
            max-width: 420px;
            margin: var(--space-xl);
        }

        .reset-logo {
            font-size: 1.8rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-align: center;
            margin-bottom: var(--space-lg);
            display: block;
        }

        .reset-card h2 {
            text-align: center;
            color: var(--dark);
            font-size: 1.4rem;
            margin-bottom: var(--space-sm);
        }

        .reset-card p.subtitulo {
            text-align: center;
            color: var(--gray);
            font-size: 0.9rem;
            margin-bottom: var(--space-xl);
        }

        .form-success {
            background: #d4edda;
            color: #155724;
            padding: 0.75rem 1rem;
            border-radius: var(--radius-sm);
            margin-bottom: var(--space-md);
            font-size: 0.9rem;
        }

        .btn-volver {
            display: block;
            text-align: center;
            margin-top: var(--space-lg);
            color: var(--primary);
            font-size: 0.9rem;
            text-decoration: none;
        }

        .btn-volver:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="reset-card">
        <span class="reset-logo">Labu</span>
        <h2>Nueva contraseña</h2>
        <p class="subtitulo">Ingresá tu nueva contraseña para recuperar el acceso.</p>

        <div class="form-error" id="resetError"></div>
        <div class="form-success" id="resetExito" style="display:none;"></div>

        <form id="reset-form">
            <div class="form-group">
                <label for="nueva-password">Nueva contraseña</label>
                <input type="password" id="nueva-password" required minlength="8" placeholder="Mínimo 8 caracteres">
            </div>
            <div class="form-group">
                <label for="confirmar-password">Confirmar contraseña</label>
                <input type="password" id="confirmar-password" required placeholder="Repetí tu nueva contraseña">
            </div>
            <button type="submit" class="btn btn-primary btn-full">Guardar contraseña</button>
        </form>

        <a href="/" class="btn-volver">Volver al inicio</a>
    </div>

    <script>
        // Leer token de la URL
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');

        if (!token) {
            document.getElementById('reset-form').style.display = 'none';
            const errorEl = document.getElementById('resetError');
            errorEl.textContent = 'Link inválido. Solicitá un nuevo link de recuperación.';
            errorEl.classList.add('visible');
        }

        document.getElementById('reset-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            const errorEl = document.getElementById('resetError');
            const exitoEl = document.getElementById('resetExito');
            errorEl.classList.remove('visible');
            exitoEl.style.display = 'none';

            const nueva = document.getElementById('nueva-password').value;
            const confirmar = document.getElementById('confirmar-password').value;

            if (nueva !== confirmar) {
                errorEl.textContent = 'Las contraseñas no coinciden';
                errorEl.classList.add('visible');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Guardando...';

            try {
                const res = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, nueva_password: nueva })
                });
                const data = await res.json();

                if (!res.ok) {
                    errorEl.textContent = data.error || 'Error al restablecer la contraseña';
                    errorEl.classList.add('visible');
                    btn.disabled = false;
                    btn.textContent = 'Guardar contraseña';
                } else {
                    exitoEl.textContent = data.mensaje + ' Redirigiendo al inicio...';
                    exitoEl.style.display = 'block';
                    document.getElementById('reset-form').style.display = 'none';
                    setTimeout(() => { window.location.href = '/'; }, 2500);
                }
            } catch {
                errorEl.textContent = 'Error de conexión';
                errorEl.classList.add('visible');
                btn.disabled = false;
                btn.textContent = 'Guardar contraseña';
            }
        });
    </script>

</body>
</html>
