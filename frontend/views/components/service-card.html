<!--
  Service Card Component — Labu
  Tarjeta de profesional/trabajador que ofrece servicios.
  Muestra avatar, nombre, rubro, calificación, habilidades,
  detalles (tarifa, distancia, experiencia) y acciones.

  Extraído de: busqueda-avanzada.js → renderCard()
               busqueda-avanzada.css → .result-card

  Uso en JS (busqueda-avanzada.js → renderCard):
    .result-avatar       → iniciales del nombre (2 chars)
    .result-name         → t.nombre
    .result-role         → t.rubro_nombre || t.profesion
    .result-rating       → t.calificacion_promedio / t.total_calificaciones
    .result-skills       → t.habilidades[] → .skill-tag
    .result-details      → tarifa / distancia / experiencia
    .btn-action.btn-primary   → onclick="verPerfil(t.id)"
    .btn-action.btn-secondary → onclick="contactar(t.id)"

  Estados de habilidades: .skill-tag (pill genérico)
  Requiere en la página: /css/variables.css, /css/global.css
-->

<div class="result-card">

    <div class="result-header">
        <div class="result-avatar">CA</div>
        <div class="result-info">
            <div class="result-name">Carlos Argüello</div>
            <div class="result-role">Electricista</div>
            <div class="result-rating">
                <span class="stars">&#11088;</span>
                <span>4.8 (32 reseñas)</span>
            </div>
        </div>
    </div>

    <div class="result-skills">
        <span class="skill-tag">Tableros</span>
        <span class="skill-tag">Instalaciones</span>
        <span class="skill-tag">Urgencias</span>
        <span class="skill-tag">LED</span>
    </div>

    <div class="result-details">
        <div>
            <div class="detail-icon">&#128176;</div>
            <div class="detail-label">Tarifa</div>
            <div class="detail-value">$3.500/h</div>
        </div>
        <div>
            <div class="detail-icon">&#128205;</div>
            <div class="detail-label">Distancia</div>
            <div class="detail-value">2.4 km</div>
        </div>
        <div>
            <div class="detail-icon">&#128197;</div>
            <div class="detail-label">Experiencia</div>
            <div class="detail-value">8 años</div>
        </div>
    </div>

    <div class="result-actions">
        <button class="btn-action btn-primary" onclick="verPerfil(1)">Ver Perfil</button>
        <button class="btn-action btn-secondary" onclick="contactar(1)">&#128172; Mensaje</button>
    </div>

</div>

<style>

    border: 2px solid transparent;
}

    transform: translateY(-4px);
    box-shadow: var(--shadow-lg);
    border-color: var(--primary);
}

.result-header { display: flex; gap: 1rem; margin-bottom: 1rem; }

    border-radius: 50%;
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--white);
    font-size: 1.5rem;
    font-weight: bold;
    flex-shrink: 0;
}

.result-role     { color: var(--gray); font-size: 0.9rem; margin-bottom: 0.5rem; }

.result-rating   { display: flex; align-items: center; gap: 0.5rem; font-size: 0.9rem; }

</style>
