<style>
/* ── NAVBAR ─────────────────────────────────────────────── */
.navbar {

    top: 0;
    left: 0;
    right: 0;
    height: 60px;
    background: var(--white);
    box-shadow: var(--shadow);
    z-index: var(--z-fixed);
    padding: 0 1rem;
}

.navbar-content {
    max-width: 1400px;
    margin: 0 auto;
    height: 100%;
    display: flex;
    align-items: center;
    gap: 1rem;
}

.logo {
    font-size: 1.5rem;
    font-weight: 900;
    color: var(--primary);
    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;
}

/* ── BUSCADOR ────────────────────────────────────────────── */
.nav-search {
    flex: 1;
    max-width: 500px;

}

.nav-search-icon {

    left: 0.75rem;

}

    font-family: var(--font-family);
    background: var(--light-gray);
    transition: var(--transition);
}

.nav-search input:focus {
    outline: none;
    border-color: var(--primary);
    background: var(--white);
}

/* ── ICONOS ──────────────────────────────────────────────── */
.nav-icons {
    display: flex;
    align-items: center;
    gap: 0.25rem;
    margin-left: auto;
    flex-shrink: 0;
}

.nav-icon {

    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    cursor: pointer;
    font-size: 1.2rem;
    transition: background var(--transition);
    user-select: none;
}

.nav-icon:hover { background: var(--light-gray); }

.nav-avatar {

.badge {

    justify-content: center;
    line-height: 1;
    border: 2px solid var(--white);
}

.nav-icon-dropdown { position: relative; }

.nav-dropdown {

    top: calc(100% + 10px);
    right: -8px;
    width: 340px;
    background: var(--white);
    border-radius: var(--radius-lg);

    animation: dropdownIn 0.15s ease;
}

.nav-dropdown::before {
    content: '';
    position: absolute;
    top: -6px;
    right: 14px;
    width: 12px;
    height: 12px;
    background: var(--white);
    border-left: 1px solid var(--border);
    border-top: 1px solid var(--border);
    transform: rotate(45deg);
}

.nav-dropdown.open { display: block; }

@keyframes dropdownIn {

}
.nav-dd-item.unread .nav-dd-text { font-weight: 600; }

.nav-dd-time {

}

.nav-dd-dot {

}
.nav-dd-item.unread .nav-dd-dot { display: block; }

/* ── TOGGLE DE PERFIL ────────────────────────────────────── */
.nav-perfil-toggle {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.35rem 0.75rem;
    border: 2px solid var(--primary);

    font-size: 0.82rem;
    font-weight: 700;
    color: var(--primary);
    background: transparent;
    transition: background var(--transition), color var(--transition);
    white-space: nowrap;
    flex-shrink: 0;
    user-select: none;
}

.nav-perfil-toggle:hover {
    background: var(--primary);
    color: var(--white);
}

.nav-perfil-toggle.loading {
    opacity: 0.6;
    pointer-events: none;
}

.toggle-switch-arrow {
    font-size: 1rem;
    line-height: 1;
}

@media (max-width: 768px) {
