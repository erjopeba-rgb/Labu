<!--
  Rating Stars Component — Labu
  Muestra una calificación de 1 a 5 estrellas con valor numérico y
  cantidad de reseñas. Puede usarse en modo display (solo lectura)
  o modo interactivo (selección del usuario).

  Modos:
    Display   → <div class="rating-stars" data-value="4.7" data-count="38">
    Editable  → añadir clase 'rating-editable' y data-value="0"

  Tamaños opcionales: .rating-sm | .rating-lg

  Inicialización JS:
    RatingStars.render(el)            → aplica data-value al DOM
    RatingStars.init('.rating-stars') → inicializa todos en la página

  Evento al seleccionar (modo editable):
    el.addEventListener('rating:change', e => console.log(e.detail.value))

  Requiere en la página: /css/variables.css, /css/global.css
-->

<!-- ── Ejemplo display (solo lectura) ── -->
<div class="rating-stars" data-value="4.7" data-count="38">
    <span class="star filled">★</span>
    <span class="star filled">★</span>
    <span class="star filled">★</span>
    <span class="star filled">★</span>
    <span class="star half">★</span>
    <span class="rating-value">4.7</span>
    <span class="rating-count">(38 reseñas)</span>
</div>

<!-- ── Ejemplo editable (para dejar calificación) ── -->
<div class="rating-stars rating-editable" data-value="0">
    <span class="star" data-v="1">★</span>
    <span class="star" data-v="2">★</span>
    <span class="star" data-v="3">★</span>
    <span class="star" data-v="4">★</span>
    <span class="star" data-v="5">★</span>
    <span class="rating-label">Seleccioná una calificación</span>
</div>

<style>
/* ── CONTENEDOR ───────────────────────────────────────────── */
.rating-stars {
    display: inline-flex;
    align-items: center;
    gap: 0.15rem;
}

/* ── ESTRELLAS ───────────────────────────────────────────── */
.rating-stars .star {
    font-size: 1.1rem;
    color: var(--border);
    line-height: 1;
    transition: color var(--transition), transform var(--transition);
    cursor: default;
    user-select: none;
}

.rating-stars .star.filled { color: #f59e0b; }

/* Media estrella: degradado izquierda dorada / derecha vacía */
.rating-stars .star.half {
    background: linear-gradient(90deg, #f59e0b 50%, var(--border) 50%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

/* ── TEXTOS ──────────────────────────────────────────────── */
.rating-value {
    font-weight: 700;
    font-size: 0.95rem;
    color: var(--dark);
    margin-left: 0.35rem;
}

.rating-count {
    font-size: 0.82rem;
    color: var(--gray);
    margin-left: 0.15rem;
}

.rating-label {
    font-size: 0.85rem;
    color: var(--gray);
    margin-left: 0.5rem;
}

/* ── MODO EDITABLE ───────────────────────────────────────── */
.rating-editable .star {
    cursor: pointer;
    font-size: 1.4rem;
}
.rating-editable .star.hover    { color: #f59e0b; transform: scale(1.15); }
.rating-editable .star.selected { color: #f59e0b; }

/* ── TAMAÑOS ─────────────────────────────────────────────── */
.rating-stars.rating-sm .star          { font-size: 0.85rem; }
.rating-stars.rating-lg .star          { font-size: 1.5rem; }
.rating-stars.rating-lg .rating-value  { font-size: 1.2rem; }
</style>

<script>
var RatingStars = (function () {

    function render(el) {
        var value = parseFloat(el.dataset.value) || 0;
        var count = el.dataset.count;
        var stars = el.querySelectorAll('.star');

        stars.forEach(function (star, i) {
            star.classList.remove('filled', 'half');
            var pos = i + 1;
            if (value >= pos) {
                star.classList.add('filled');
            } else if (value >= pos - 0.5) {
                star.classList.add('half');
            }
        });

        var valueEl = el.querySelector('.rating-value');
        if (valueEl && value > 0) valueEl.textContent = value.toFixed(1);

        var countEl = el.querySelector('.rating-count');
        if (countEl && count !== undefined) {
            countEl.textContent = count > 0 ? '(' + count + ' reseñas)' : '';
        }
    }

    function initEditable(el) {
        var stars = el.querySelectorAll('.star');
        var label = el.querySelector('.rating-label');
        var labels = ['Muy malo', 'Malo', 'Regular', 'Bueno', '¡Excelente!'];

        stars.forEach(function (star, i) {
            star.addEventListener('mouseover', function () {
                stars.forEach(function (s, j) { s.classList.toggle('hover', j <= i); });
                if (label) label.textContent = labels[i] || '';
            });

            star.addEventListener('mouseout', function () {
                var selected = parseInt(el.dataset.value) || 0;
                stars.forEach(function (s, j) {
                    s.classList.remove('hover');
                    s.classList.toggle('selected', j < selected);
                });
                if (label) {
                    label.textContent = selected > 0 ? labels[selected - 1] : 'Seleccioná una calificación';
                }
            });

            star.addEventListener('click', function () {
                el.dataset.value = i + 1;
                stars.forEach(function (s, j) { s.classList.toggle('selected', j <= i); });
                if (label) label.textContent = labels[i];
                el.dispatchEvent(new CustomEvent('rating:change', { detail: { value: i + 1 }, bubbles: true }));
            });
        });
    }

    function init(selector) {
        document.querySelectorAll(selector || '.rating-stars').forEach(function (el) {
            if (el.classList.contains('rating-editable')) {
                initEditable(el);
            } else {
                render(el);
            }
        });
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', function () { init(); });
    } else {
        init();
    }

    return { render: render, init: init };
})();
</script>
