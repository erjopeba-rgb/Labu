<!--
  Sidebar Derecho Component — Labu
  Panel lateral informativo: mapa de cercanía y acciones contextuales.
  Requiere en la página: /css/variables.css, /css/global.css, /css/cards.css
-->

<aside class="sidebar-right">

    <!-- Mapa de cercanía -->
    <div class="card">
        <h4 class="sidebar-section-title">&#128205; Mapa de Cercanía</h4>
        <div id="leafletMap" style="width:100%;height:180px;border-radius:var(--radius);z-index:0;"></div>
        <p id="mapStatus" style="font-size:0.75rem;color:var(--gray);margin-top:0.5rem;text-align:center;display:none;">Activá la ubicación para ver el mapa</p>
    </div>

    <!-- Trabajadores cercanos -->
    <div class="card">
        <h4 class="sidebar-section-title">&#128100; Cerca de Vos</h4>
        <div class="nearby-list" id="nearbyList">
            <div class="nearby-empty">Activá la ubicación para ver profesionales cercanos</div>
        </div>
    </div>

    <!-- Accesos rápidos -->
    <div class="card">
        <h4 class="sidebar-section-title">&#9889; Accesos Rápidos</h4>
        <div class="quick-actions">
            <button class="quick-action-btn" data-page="publicar-trabajo">
                &#128736; Publicar Trabajo
            </button>
            <button class="quick-action-btn" data-page="planner-3d">
                &#128190; Planner 3D
            </button>
        </div>
    </div>

</aside>

<style>
/* ── SIDEBAR DERECHO ─────────────────────────────────────── */
.sidebar-right {
    position: sticky;
    top: 80px;
    height: fit-content;
    display: flex;
    flex-direction: column;
    gap: 1rem;
}

.sidebar-section-title {
    font-size: 0.9rem;
    font-weight: 700;
    margin-bottom: 0.75rem;
    color: var(--dark);
}

/* ── MAPA ────────────────────────────────────────────────── */
.map-preview {
    width: 100%;
    height: 160px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    border-radius: var(--radius);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    color: var(--white);
}

.map-placeholder-icon { font-size: 2.5rem; }
.map-placeholder-text { font-size: 0.75rem; opacity: 0.85; }

/* ── CERCANOS ────────────────────────────────────────────── */
.nearby-list { display: flex; flex-direction: column; gap: 0.5rem; }

.nearby-empty {
    font-size: 0.8rem;
    color: var(--gray);
    text-align: center;
    padding: 0.75rem 0;
    line-height: 1.4;
}

.nearby-item {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.5rem;
    border-radius: var(--radius);
    cursor: pointer;
    transition: background var(--transition);
}

.nearby-item:hover { background: var(--light-gray); }

.nearby-avatar {
    width: 36px;
    height: 36px;
    min-width: 36px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    color: var(--white);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.85rem;
    font-weight: 700;
}

.nearby-info { flex: 1; min-width: 0; }
.nearby-name { font-size: 0.85rem; font-weight: 600; }
.nearby-rubro { font-size: 0.75rem; color: var(--gray); }
.nearby-dist { font-size: 0.75rem; color: var(--primary); font-weight: 600; white-space: nowrap; }

/* ── ACCESOS RÁPIDOS ─────────────────────────────────────── */
.quick-actions { display: flex; flex-direction: column; gap: 0.5rem; }

.quick-action-btn {
    width: 100%;
    padding: 0.6rem 0.75rem;
    background: var(--light-gray);
    border: none;
    border-radius: var(--radius);
    font-size: 0.85rem;
    font-family: var(--font-family);
    cursor: pointer;
    text-align: left;
    transition: all var(--transition);
    color: var(--dark);
}

.quick-action-btn:hover {
    background: var(--primary);
    color: var(--white);
}
</style>

<script>
(function () {
    // Los botones con data-page son capturados por main.js automáticamente.
    // Aquí sólo se inicializa la lógica de cercanía cuando esté disponible.

    function initNearby() {
        // El mapa Leaflet se inicializa desde el script inline de la página (feed.html)
        // que carga leaflet.js antes de este componente.
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initNearby);
    } else {
        initNearby();
    }
})();
</script>
