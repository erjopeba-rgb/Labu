<!--
  Task Selector Component — Labu
  Selector de tipo de tarea/proyecto con status badges y filter tabs.
  Extraído de: publicar-trabajo.html (project-type-selector), mis-trabajos.html (filter-tabs),
               proyecto-completo.html (status-badge).
  Requiere en la página: /css/variables.css, /css/global.css
-->

<!-- Contenedor vacío; se inicializa con TaskSelector.init() o se usa inline -->
<div class="task-selector" id="taskSelector" role="group" aria-label="Tipo de tarea"></div>

<style>
/* ── TASK SELECTOR (tarjetas clickeables) ────────────────── */
.task-selector {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 0.75rem;
}

.task-option {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.5rem;
    padding: 1.25rem 1rem;
    border: 2px solid var(--border);
    border-radius: var(--radius);
    cursor: pointer;
    transition: all var(--transition);
    text-align: center;
    background: var(--white);
    user-select: none;
}

.task-option:hover {
    border-color: var(--primary);
    background: rgba(102, 51, 153, 0.04);
}

.task-option.selected {
    border-color: var(--primary);
    background: rgba(102, 51, 153, 0.08);
    box-shadow: 0 0 0 3px rgba(102, 51, 153, 0.12);
}

.task-option-icon  { font-size: 1.75rem; line-height: 1; }
.task-option-title { font-weight: 700; font-size: 0.9rem; color: var(--dark); }
.task-option-desc  { font-size: 0.78rem; color: var(--gray); line-height: 1.3; }

/* ── STATUS BADGE (en tarjetas de tarea) ─────────────────── */
.status-badge {
    display: inline-flex;
    align-items: center;
    gap: 0.25rem;
    padding: 0.25rem 0.65rem;
    border-radius: 20px;
    font-size: 0.75rem;
    font-weight: 600;
    white-space: nowrap;
}

.status-completed     { background: #d4edda; color: #155724; }
.status-active        { background: #cce5ff; color: #004085; }
.status-pending       { background: #fff3cd; color: #856404; }
.status-cancelled     { background: #f8d7da; color: #721c24; }

/* ── FILTER TABS ─────────────────────────────────────────── */
.task-filter-tabs {
    display: flex;
    gap: 0.25rem;
    flex-wrap: wrap;
}

.task-filter-tab {
    padding: 0.4rem 0.9rem;
    border: 2px solid var(--border);
    border-radius: 20px;
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
    transition: all var(--transition);
    background: var(--white);
    color: var(--gray);
    white-space: nowrap;
}

.task-filter-tab:hover  { border-color: var(--primary); color: var(--primary); }
.task-filter-tab.active { background: var(--primary); border-color: var(--primary); color: var(--white); }
</style>

<script>
(function () {
    const TaskSelector = {
        /**
         * Inicializa un selector de tareas en un contenedor.
         * @param {HTMLElement|string} container
         * @param {Array<{value, icon, title, desc?}>} options
         * @param {function} onChange — callback(value)
         * @param {string} [selected] — valor inicial seleccionado
         */
        init(container, options, onChange, selected) {
            const el = typeof container === 'string'
                ? document.getElementById(container)
                : container;
            if (!el) return;

            el.innerHTML = options.map(opt => `
                <div class="task-option${selected === opt.value ? ' selected' : ''}"
                     data-value="${opt.value}"
                     role="radio"
                     aria-checked="${selected === opt.value}"
                     tabindex="0">
                    <div class="task-option-icon">${opt.icon || '📋'}</div>
                    <div class="task-option-title">${opt.title}</div>
                    ${opt.desc ? `<div class="task-option-desc">${opt.desc}</div>` : ''}
                </div>
            `).join('');

            el.addEventListener('click', e => {
                const opt = e.target.closest('.task-option');
                if (!opt) return;
                el.querySelectorAll('.task-option').forEach(o => {
                    o.classList.remove('selected');
                    o.setAttribute('aria-checked', 'false');
                });
                opt.classList.add('selected');
                opt.setAttribute('aria-checked', 'true');
                if (onChange) onChange(opt.dataset.value);
            });

            el.addEventListener('keydown', e => {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    e.target.closest('.task-option')?.click();
                }
            });
        },

        /** Devuelve el valor seleccionado de un contenedor */
        getValue(container) {
            const el = typeof container === 'string'
                ? document.getElementById(container)
                : container;
            return el?.querySelector('.task-option.selected')?.dataset.value || null;
        },

        /**
         * Renderiza un status-badge inline (para tarjetas, timelines).
         * @param {'completado'|'en_progreso'|'pendiente'|'cancelado'|'publicado'|'en_negociacion'|'finalizado'} status
         * @returns {string}
         */
        statusBadge(status) {
            const map = {
                completado:      { cls: 'status-completed', label: '✅ Completado'      },
                en_progreso:     { cls: 'status-active',    label: '🔄 En Progreso'     },
                pendiente:       { cls: 'status-pending',   label: '⏳ Pendiente'        },
                cancelado:       { cls: 'status-cancelled', label: '❌ Cancelado'        },
                publicado:       { cls: 'status-active',    label: '📢 Publicado'        },
                en_negociacion:  { cls: 'status-pending',   label: '💬 En Negociación'  },
                finalizado:      { cls: 'status-completed', label: '✅ Finalizado'       },
                en_curso:        { cls: 'status-active',    label: '🔄 En Curso'         },
            };
            const s = map[status] || { cls: 'status-pending', label: status };
            return `<span class="status-badge ${s.cls}">${s.label}</span>`;
        }
    };

    window.TaskSelector = TaskSelector;
})();
</script>
