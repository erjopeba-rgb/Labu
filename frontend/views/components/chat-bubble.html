<!--
  Chat Bubble Component — Labu
  Burbujas de mensaje individuales para la interfaz de chat.
  Extraído de: mensajes.html
  Requiere en la página: /css/variables.css, /css/global.css, /css/mensajes.css
-->

<!-- Las burbujas se insertan dinámicamente en .messages-area con ChatBubble.append() -->

<style>
/* ── MESSAGES AREA ───────────────────────────────────────── */
.messages-area {
    flex: 1;
    overflow-y: auto;
    padding: 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
}

/* ── BUBBLE GROUP ────────────────────────────────────────── */
.bubble-group {
    display: flex;
    flex-direction: column;
    gap: 0.2rem;
    max-width: 72%;
}

.bubble-group.sent {
    align-self: flex-end;
    align-items: flex-end;
}

.bubble-group.received {
    align-self: flex-start;
    align-items: flex-start;
}

.bubble-sender {
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--gray);
    padding: 0 0.5rem;
}

/* ── BUBBLE ──────────────────────────────────────────────── */
.bubble {
    padding: 0.65rem 1rem;
    border-radius: 18px;
    font-size: 0.92rem;
    line-height: 1.45;
    word-break: break-word;
}

.bubble-group.sent .bubble {
    background: var(--primary);
    color: var(--white);
    border-bottom-right-radius: 4px;
}

.bubble-group.received .bubble {
    background: var(--light-gray);
    color: var(--dark);
    border-bottom-left-radius: 4px;
}

/* ── META (hora + ticks) ─────────────────────────────────── */
.bubble-meta {
    display: flex;
    align-items: center;
    gap: 0.3rem;
    padding: 0 0.5rem;
}

.bubble-time {
    font-size: 0.7rem;
    color: var(--gray);
}

.bubble-status { font-size: 0.7rem; color: var(--gray); }
.bubble-status.read { color: var(--primary); }

/* ── DATE SEPARATOR ──────────────────────────────────────── */
.bubble-date-sep {
    align-self: center;
    font-size: 0.75rem;
    color: var(--gray);
    background: var(--light-gray);
    padding: 0.25rem 0.75rem;
    border-radius: 12px;
    margin: 0.5rem 0;
}

/* ── TYPING INDICATOR ────────────────────────────────────── */
.typing-indicator {
    display: flex;
    gap: 4px;
    align-items: center;
    padding: 0 0.25rem;
}

.typing-dot {
    width: 7px;
    height: 7px;
    background: var(--gray);
    border-radius: 50%;
    animation: typing-bounce 1.2s ease-in-out infinite;
}

.typing-dot:nth-child(2) { animation-delay: 0.2s; }
.typing-dot:nth-child(3) { animation-delay: 0.4s; }

@keyframes typing-bounce {
    0%, 60%, 100% { transform: translateY(0); }
    30%            { transform: translateY(-6px); }
}
</style>

<script>
(function () {
    const ChatBubble = {
        /**
         * Genera el HTML de una burbuja de mensaje.
         * @param {{ id?, texto, enviado, remitente?, hora?, leido? }} msg
         * @returns {string}
         */
        render(msg) {
            const dir = msg.enviado ? 'sent' : 'received';
            const check = msg.enviado ? (msg.leido ? '✓✓' : '✓') : '';
            const checkClass = msg.leido ? 'read' : '';
            const hora = msg.hora
                ? new Date(msg.hora).toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' })
                : '';

            return `
                <div class="bubble-group ${dir}"${msg.id ? ` data-msg-id="${msg.id}"` : ''}>
                    ${!msg.enviado && msg.remitente
                        ? `<div class="bubble-sender">${this._esc(msg.remitente)}</div>`
                        : ''}
                    <div class="bubble">${this._esc(msg.texto || '')}</div>
                    <div class="bubble-meta">
                        ${hora ? `<span class="bubble-time">${hora}</span>` : ''}
                        ${msg.enviado ? `<span class="bubble-status ${checkClass}">${check}</span>` : ''}
                    </div>
                </div>
            `;
        },

        /** Separador de fecha entre grupos de mensajes */
        renderDateSep(label) {
            return `<div class="bubble-date-sep">${this._esc(label)}</div>`;
        },

        /**
         * Inserta una burbuja en el contenedor y hace scroll al final.
         * @param {HTMLElement|string} container
         * @param {object} msg
         */
        append(container, msg) {
            const el = typeof container === 'string'
                ? document.getElementById(container)
                : container;
            if (!el) return;
            el.insertAdjacentHTML('beforeend', this.render(msg));
            el.scrollTop = el.scrollHeight;
        },

        /** Marca como leído el último mensaje enviado en el contenedor */
        markRead(container) {
            const el = typeof container === 'string'
                ? document.getElementById(container)
                : container;
            el?.querySelectorAll('.bubble-group.sent .bubble-status')
              .forEach(s => { s.textContent = '✓✓'; s.classList.add('read'); });
        },

        _esc(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }
    };

    window.ChatBubble = ChatBubble;
})();
</script>
