<!--
  Job Card Component — Labu
  Tarjeta de trabajo propio (mis-trabajos). Muestra estado, título,
  metadatos, detalles (presupuesto, modalidad, ofertas) y acciones.
  El panel de ofertas recibidas se expande al hacer clic en "Ver Ofertas".

  Estados posibles (clase en .job-status-badge):
    status-publicado | status-en_negociacion | status-en_curso
    status-finalizado | status-cancelado

  Uso en JS (mis-trabajos.js → renderJobCard):
    id="job-${job.id}"
    .ofertas-section id="ofertas-${job.id}" → toggle class 'visible'
    .btn-action-primary → onclick="verOfertas(jobId)"
    .btn-action-danger  → onclick="cancelarTrabajo(jobId)"

  Requiere en la página: /css/variables.css, /css/global.css
-->

<div class="job-card" id="job-1">

    <div class="job-card-header">
        <span class="job-status-badge status-publicado">&#128226; Publicado</span>
        <span class="urgency-badge">&#9889; Urgente</span>
        <div class="job-title">Instalación eléctrica en oficina</div>
        <div class="job-meta">&#128205; Córdoba, Córdoba</div>
        <div class="job-meta">&#128336; Publicado hace 2 horas</div>
    </div>

    <div class="job-card-body">
        <div class="job-details">
            <div class="detail-item">
                <div class="detail-label">Presupuesto</div>
                <div class="detail-value detail-primary">$80.000</div>
            </div>
            <div class="detail-item">
                <div class="detail-label">Modalidad</div>
                <div class="detail-value">Presencial</div>
            </div>
            <div class="detail-item">
                <div class="detail-label">Ofertas recibidas</div>
                <div class="detail-value">3</div>
            </div>
            <div class="detail-item">
                <div class="detail-label">Estado</div>
                <div class="detail-value">Publicado</div>
            </div>
        </div>

        <div class="job-actions">
            <button class="btn-action btn-action-primary">&#128176; Ver Ofertas (3)</button>
            <button class="btn-action btn-action-danger">&#10060; Cancelar</button>
        </div>

        <!-- Panel de ofertas recibidas (oculto por defecto, toggle con .visible) -->
        <div class="ofertas-section" id="ofertas-1">
            <div class="ofertas-title">Ofertas recibidas:</div>

            <div class="oferta-item">
                <div>
                    <div class="oferta-monto">$95.000</div>
                    <div class="oferta-user">&#128100; Carlos López &bull; 3 días</div>
                    <div class="oferta-msg">"Puedo empezar mañana, traigo todos los materiales."</div>
                </div>
                <div class="oferta-actions">
                    <button class="btn-mini btn-mini-success">&#10003; Aceptar</button>
                    <button class="btn-mini btn-mini-counter">&#8617; Contraofertar</button>
                    <button class="btn-mini btn-mini-danger">&#10007; Rechazar</button>
                </div>
            </div>

        </div>
    </div>

</div>

<style>
/* ── JOB CARD ─────────────────────────────────────────────── */
.job-card {
    border: 2px solid var(--border);
    border-radius: var(--radius-md);
    overflow: hidden;
    background: var(--white);
    transition: all var(--transition);
}
.job-card:hover { border-color: var(--primary); box-shadow: var(--shadow); transform: translateY(-3px); }

.job-card-header { padding: 1.25rem; border-bottom: 1px solid var(--border); }

/* ── STATUS BADGE ─────────────────────────────────────────── */
.job-status-badge {
    display: inline-block;
    padding: 0.35rem 0.8rem;
    border-radius: var(--radius-full);
    font-size: 0.75rem;
    font-weight: bold;
    margin-bottom: 0.75rem;
}

.status-publicado      { background: #e3f2fd; color: #1976d2; }
.status-en_negociacion { background: var(--warning-light); color: #856404; }
.status-en_curso       { background: #e8f5e9; color: #388e3c; }
.status-finalizado     { background: var(--success-light); color: #155724; }
.status-cancelado      { background: var(--danger-light); color: #721c24; }

.urgency-badge {
    display: inline-block;
    padding: 0.3rem 0.6rem;
    background: var(--warning-light);
    color: #856404;
    border-radius: var(--radius-full);
    font-size: 0.75rem;
    font-weight: bold;
    margin-left: 0.5rem;
}

.job-title {
    font-size: 1.05rem;
    font-weight: bold;
    margin-bottom: 0.5rem;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.job-meta { font-size: 0.85rem; color: var(--gray); margin-bottom: 0.25rem; }

/* ── BODY & DETALLES ─────────────────────────────────────── */
.job-card-body { padding: 1.25rem; }

.job-details {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 0.75rem;
    margin-bottom: 1rem;
}

.detail-item    { display: flex; flex-direction: column; }
.detail-label   { font-size: 0.75rem; color: var(--gray); margin-bottom: 0.2rem; }
.detail-value   { font-weight: 600; font-size: 0.95rem; }
.detail-primary { color: var(--primary); }

/* ── BOTONES DE ACCIÓN ───────────────────────────────────── */
.job-actions { display: flex; gap: 0.5rem; }

.btn-action {
    flex: 1;
    padding: 0.6rem;
    border: none;
    border-radius: var(--radius);
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    font-family: var(--font-family);
    transition: all var(--transition);
}
.btn-action-primary         { background: var(--primary); color: var(--white); }
.btn-action-primary:hover   { background: var(--primary-dark); }
.btn-action-secondary       { background: var(--light-gray); color: var(--dark); }
.btn-action-secondary:hover { background: var(--border); }
.btn-action-danger          { background: var(--danger-light); color: var(--danger); }
.btn-action-danger:hover    { background: var(--danger); color: var(--white); }

/* ── PANEL DE OFERTAS ────────────────────────────────────── */
.ofertas-section {
    margin-top: 1rem;
    padding-top: 1rem;
    border-top: 1px solid var(--border);
    display: none;
}
.ofertas-section.visible { display: block; }

.ofertas-title { font-weight: 600; font-size: 0.9rem; margin-bottom: 0.75rem; color: var(--gray); }

.oferta-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0.75rem;
    background: var(--light-gray);
    border-radius: var(--radius);
    margin-bottom: 0.5rem;
    font-size: 0.9rem;
    gap: 0.5rem;
}

.oferta-monto { font-weight: bold; color: var(--primary); }
.oferta-user  { color: var(--gray); font-size: 0.85rem; }
.oferta-msg   { font-size: 0.8rem; color: var(--gray); margin-top: 0.25rem; font-style: italic; }

.oferta-actions { display: flex; gap: 0.5rem; flex-shrink: 0; }

.btn-mini {
    padding: 0.3rem 0.75rem;
    border: none;
    border-radius: var(--radius);
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
    font-family: var(--font-family);
    transition: all var(--transition);
}
.btn-mini-success       { background: var(--success-light); color: #155724; }
.btn-mini-success:hover { background: var(--success); color: var(--white); }
.btn-mini-counter       { background: #e3f2fd; color: #1565c0; }
.btn-mini-counter:hover { background: var(--primary); color: var(--white); }
.btn-mini-danger        { background: var(--danger-light); color: var(--danger); }
.btn-mini-danger:hover  { background: var(--danger); color: var(--white); }
</style>
