name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rtype1_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # Estas variables sobreescriben las del .env.test (dotenv no pisa process.env existentes)
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: rtype1_test
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: rtype1_ci_test_secret_key_larga_2024
      JWT_EXPIRES_IN: 7d
      PORT: 3001
      CORS_ORIGIN: http://localhost:3001
      NODE_ENV: test

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias del backend
        working-directory: backend
        run: npm ci

      # ─── Schema base (blueprints en orden de dependencias) ───────────────────
      - name: Crear schema base
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d rtype1_test -f database/data/blueprints/etapa1.sql
          psql -h localhost -U postgres -d rtype1_test -f database/data/blueprints/etapa2_seguridad.sql
          psql -h localhost -U postgres -d rtype1_test -f database/data/blueprints/etapa3_precios.sql
          psql -h localhost -U postgres -d rtype1_test -f database/data/blueprints/etapa4_perfiles.sql
          psql -h localhost -U postgres -d rtype1_test -f database/data/blueprints/etapa5_tienda.sql
          psql -h localhost -U postgres -d rtype1_test -f database/data/blueprints/etapa6_geolocalizacion.sql
          psql -h localhost -U postgres -d rtype1_test -f database/data/blueprints/etapa7_confianza.sql
          psql -h localhost -U postgres -d rtype1_test -f database/data/blueprints/etapa8_pagos.sql
          psql -h localhost -U postgres -d rtype1_test -f database/data/blueprints/etapa9_comunicacion.sql
          psql -h localhost -U postgres -d rtype1_test -f database/data/blueprints/etapa10_equipate.sql
          psql -h localhost -U postgres -d rtype1_test -f database/data/blueprints/etapa11_features.sql
          psql -h localhost -U postgres -d rtype1_test -f database/data/blueprints/migracion_trabajos_fotos.sql

      # ─── Migraciones (runner automático — lee database/migrations/ en orden alfabético) ──
      - name: Aplicar migraciones
        working-directory: backend
        run: npm run migrate

      # ─── Tests ───────────────────────────────────────────────────────────────
      - name: Ejecutar tests
        working-directory: backend
        run: npm test
